[theme]
primaryColor = "#1F4E79"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#1A1A1A"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
